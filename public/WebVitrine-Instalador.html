<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Vitrine - Aplicativo</title>
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #16151a;
      border: 1px solid #d4af37;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 320px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #d4af37, #b8860b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #000;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: #a8a29e;
      margin: 0 0 24px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      background: linear-gradient(90deg, #d4af37, #f3e5ab, #b8860b);
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 14px;
      transition: transform 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">W</div>
    <h1>Web Vitrine</h1>
    <p>Iniciando o aplicativo oficial da vitrine de luxo...</p>
    <a id="launch-btn" href="/" class="btn">Abrir Aplicativo</a>
  </div>
  <script>
    // Automatic direct redirect on launch
    setTimeout(function() {
      window.location.href = '/';
    }, 600);
  </script>
</body>
</html>
